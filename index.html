<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CMSH">
<meta name="theme-color" content="#c2410c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.30.0/lib/msal-browser.min.js"
        integrity="sha384-RGxxfG5yRS8DLU7ZJ8OoLhbV/BsJFHyPuMVHrTLbpj3t5Z15LnviJmaznKY/a7LZ"
        crossorigin="anonymous"></script>
<title>CMSH Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html, body { margin: 0; } [hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout: an instrument-panel search bar over a two-pane reader (results | provision), with Map, Library and Saved as sibling tabs. */
:root {
  --paper: #f3f5f6; --surface: #ffffff; --raised: #f8fafb; --ink: #17212b; --muted: #59656f; --faint: #8a949d;
  --line: #d9dfe4; --line-strong: #bfc8cf;
  --accent: #c2410c; --accent-ink: #ffffff; --accent-soft: #fdebe1;
  --mark: #ffe58a; --mark-ink: #17212b;
  --t-act: #1d5d8a; --t-reg: #5a4a99; --t-rs: #8a5600; --t-qgn: #2e6a3b; --t-gl: #75513a; --t-std: #5e6973;
  --ok: #2e7d4f; --ok-soft: #e3f3e9; --warn: #9a6200; --warn-soft: #fbf0d9; --bad: #b42318; --bad-soft: #fde7e4;
  --f-ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11161b; --surface: #182029; --raised: #1d2630; --ink: #e5eaee; --muted: #a0abb5; --faint: #77838e;
  --line: #2a3540; --line-strong: #3a4754;
  --accent: #ff7d3f; --accent-ink: #1a0d05; --accent-soft: #3a2116;
  --mark: #6b5310; --mark-ink: #fff6d6;
  --t-act: #6fb2e3; --t-reg: #a99bf0; --t-rs: #e2a845; --t-qgn: #79c48a; --t-gl: #d1a17f; --t-std: #a4afb8;
  --ok: #6fd39b; --ok-soft: #173326; --warn: #f0b955; --warn-soft: #362a12; --bad: #ff8a7a; --bad-soft: #3d1a17;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #11161b; --surface: #182029; --raised: #1d2630; --ink: #e5eaee; --muted: #a0abb5; --faint: #77838e;
  --line: #2a3540; --line-strong: #3a4754;
  --accent: #ff7d3f; --accent-ink: #1a0d05; --accent-soft: #3a2116;
  --mark: #6b5310; --mark-ink: #fff6d6;
  --t-act: #6fb2e3; --t-reg: #a99bf0; --t-rs: #e2a845; --t-qgn: #79c48a; --t-gl: #d1a17f; --t-std: #a4afb8;
  --ok: #6fd39b; --ok-soft: #173326; --warn: #f0b955; --warn-soft: #362a12; --bad: #ff8a7a; --bad-soft: #3d1a17;
  color-scheme: dark }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--t-act); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: minmax(0, 1fr); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 12px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand > * { min-width: 0; }
.brand h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.brand .sub { color: var(--muted); font-size: 12.5px; }
.brand .status { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; }
.dot.on { background: var(--ok); }
.qrow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.qbox { flex: 1 1 360px; min-width: 0; display: flex; align-items: center; background: var(--raised); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 0 10px; }
.qbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.qbox svg { flex: none; color: var(--muted); }
#q { flex: 1; min-width: 0; border: 0; background: transparent; padding: 11px 8px; font-size: 15px; outline: none; }
.sel { border: 1px solid var(--line-strong); background: var(--raised); border-radius: var(--r); padding: 0 8px; height: 42px; max-width: 100%; min-width: 0; width: 230px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r); padding: 7px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--raised); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.tabs { display: flex; gap: 2px; margin-top: 10px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 9px 12px 10px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .n { font-family: var(--f-mono); font-size: 11px; color: var(--faint); margin-left: 4px; font-weight: 400; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; padding-block: 8px; align-items: center; border-bottom: 1px solid var(--line); background: var(--paper); }
.chipf { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
.chipf[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.filters .sp { flex: 1; }

main { min-height: 0; overflow: hidden; }
.view { height: 100%; min-height: 0; }
.split { display: grid; grid-template-columns: minmax(300px, 40%) 1fr; height: 100%; min-height: 0; }
.pane { overflow-y: auto; min-width: 0; min-height: 0; }
.pane.left { border-right: 1px solid var(--line); }
.scroll { height: 100%; overflow-y: auto; }

/* badges */
.badge { font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; display: inline-block; line-height: 1.5; }
.b-act { color: var(--t-act); } .b-reg { color: var(--t-reg); } .b-reg2001 { color: var(--faint); } .b-rs { color: var(--t-rs); } .b-qgn { color: var(--t-qgn); } .b-guideline, .b-gl { color: var(--t-gl); } .b-std, .b-other { color: var(--t-std); }

/* results */
.rhead { padding-block: 12px 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rhead .count { color: var(--muted); font-size: 12.5px; }
.rhead .sp { flex: 1; }
.suggest { margin-block: 4px 10px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; }
.suggest h3, .side h3 { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.reflist { display: flex; flex-wrap: wrap; gap: 6px; }
.ref { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--raised); border-radius: 4px; padding: 3px 8px; cursor: pointer; font-size: 12.5px; text-align: left; }
.ref:hover { border-color: var(--line-strong); background: var(--surface); }
.ref .k { font-family: var(--f-mono); font-size: 12px; font-weight: 500; }
.ref .why { color: var(--faint); font-size: 11.5px; }
.ref.missing .k { opacity: .8; }
.ref.missing::after { content: "not loaded"; font-size: 10.5px; color: var(--faint); border-left: 1px solid var(--line); padding-left: 6px; }
.k-act { color: var(--t-act); } .k-reg { color: var(--t-reg); } .k-reg2001 { color: var(--faint); } .k-rs { color: var(--t-rs); } .k-qgn { color: var(--t-qgn); } .k-std { color: var(--t-std); } .k-gl { color: var(--t-gl); }

.result { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
.result:hover { border-color: var(--line-strong); }
.result[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.result .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.result .num { font-family: var(--f-mono); color: var(--ink); font-size: 12.5px; }
.result h4 { margin: 4px 0 4px; font-size: 14.5px; font-weight: 600; line-height: 1.3; text-wrap: balance; }
.result p { margin: 0; color: var(--muted); font-size: 13px; font-family: var(--f-read); line-height: 1.5; overflow-wrap: anywhere; }
.result .rel { margin-top: 6px; font-size: 11.5px; color: var(--faint); display: flex; flex-wrap: wrap; gap: 4px 8px; }
.score { margin-left: auto; width: 46px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; flex: none; }
.score i { display: block; height: 100%; background: var(--accent); }
mark { background: var(--mark); color: var(--mark-ink); padding: 0 1px; border-radius: 2px; }

/* reader */
.reader { padding-block: 18px 40px; max-width: 980px; }
.crumbs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.crumbs .sep { color: var(--faint); }
.reader h2 { font-size: 22px; line-height: 1.25; margin: 8px 0 4px; letter-spacing: -0.01em; text-wrap: balance; }
.reader h2 .num { font-family: var(--f-mono); font-weight: 500; color: var(--muted); font-size: 18px; margin-right: 8px; }
.docline { color: var(--muted); font-size: 12.5px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 14px; }
.rgrid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; align-items: start; }
.text { font-family: var(--f-read); font-size: 16px; line-height: 1.62; max-width: 68ch; overflow-wrap: anywhere; }
.text p { margin: 0 0 .75em; }
.text p.li { padding-left: 1.4em; text-indent: -1.1em; }
.text .lk { background: none; border: 0; padding: 0; color: var(--t-act); text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); text-underline-offset: 3px; cursor: pointer; font: inherit; }
.text .lk.k-reg { color: var(--t-reg); } .text .lk.k-rs { color: var(--t-rs); } .text .lk.k-qgn { color: var(--t-qgn); } .text .lk.k-std { color: var(--t-std); } .text .lk.k-reg2001 { color: var(--faint); }
.side { display: grid; gap: 16px; position: sticky; top: 0; }
.side section { border-top: 1px solid var(--line); padding-top: 10px; }
.side .item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 0; cursor: pointer; font-size: 13px; line-height: 1.35; }
.side .item:hover .h { text-decoration: underline; }
.side .item .h { display: block; }
.side .item small { color: var(--faint); font-size: 11.5px; }
.side .none { color: var(--faint); font-size: 12.5px; }
.note { border: 1px solid var(--line); background: var(--raised); border-radius: var(--r); padding: 10px 12px; font-size: 13px; color: var(--muted); }
.note.warn { background: var(--warn-soft); border-color: transparent; color: var(--ink); }
.outline { list-style: none; padding: 0; margin: 0; columns: 2 260px; column-gap: 24px; }
.outline li { break-inside: avoid; }
.outline button { border: 0; background: none; padding: 4px 0; cursor: pointer; text-align: left; font-size: 13.5px; }
.outline button:hover { text-decoration: underline; }
.outline .num { font-family: var(--f-mono); color: var(--muted); font-size: 12px; margin-right: 6px; }

.empty { padding: 40px 8px; color: var(--muted); max-width: 560px; }
.empty h3 { color: var(--ink); font-size: 16px; margin: 0 0 6px; }
.tries { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.back { display: none; }

/* map, library, saved */
.page { padding-block: 16px 48px; max-width: 1180px; }
.page h2 { font-size: 18px; margin: 0 0 4px; }
.page .lead { color: var(--muted); margin: 0 0 14px; max-width: 75ch; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.box h3 { margin: 0 0 8px; font-size: 14px; }
.maprow { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 7px 0; border-top: 1px solid var(--line); }
.maprow:first-of-type { border-top: 0; }
.maprow .key { font-family: var(--f-mono); font-weight: 500; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.maprow .what { font-size: 13px; min-width: 0; }
.maprow .what .h { color: var(--ink); }
.maprow .what .by { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.maprow .c { font-family: var(--f-mono); color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.mini { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; background: var(--raised); cursor: pointer; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--raised); position: sticky; top: 0; }
td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; margin: 0 4px 3px 0; white-space: nowrap; }
.p-ok { background: var(--ok-soft); color: var(--ok); } .p-warn { background: var(--warn-soft); color: var(--warn); } .p-bad { background: var(--bad-soft); color: var(--bad); } .p-none { background: var(--raised); color: var(--muted); border: 1px solid var(--line); }
.summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; min-width: 120px; }
.stat b { font-size: 20px; font-variant-numeric: tabular-nums; display: block; }
.stat span { font-size: 12px; color: var(--muted); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar .sp { flex: 1; }
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--r); padding: 14px; text-align: center; color: var(--muted); background: var(--surface); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.form label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.form input, .form select, .form textarea, .inline input, .inline textarea { border: 1px solid var(--line-strong); background: var(--raised); border-radius: 5px; padding: 7px 9px; font-weight: 400; color: var(--ink); width: 100%; min-width: 0; }
.form .full { grid-column: 1 / -1; }
.inline { display: grid; gap: 8px; margin-top: 8px; padding: 10px; background: var(--raised); border-radius: var(--r); border: 1px solid var(--line); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.saved { display: grid; gap: 10px; }
.scard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.scard .q { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.scard .d { color: var(--muted); margin: 4px 0 6px; font-family: var(--f-read); font-size: 14px; }
.scard .kw { display: flex; gap: 4px; flex-wrap: wrap; }
.kwchip { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border: 0; cursor: pointer; }
.kwchip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.scard .snap { font-size: 12px; color: var(--faint); margin-top: 6px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: var(--r); font-size: 13px; z-index: 50; max-width: calc(100% - 32px); }
.muted { color: var(--muted); } .faint { color: var(--faint); } .mono { font-family: var(--f-mono); }

@media (max-width: 860px) {
  .split { grid-template-columns: 1fr; }
  .pane.left { border-right: 0; }
  .split.reading .pane.left { display: none; }
  .split:not(.reading) .pane.right { display: none; }
  .back { display: inline-flex; }
  .rgrid { grid-template-columns: minmax(0, 1fr); }
  .reader { max-width: 100%; }
  .side { position: static; }
  .brand .status { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top wrap">
    <div class="brand">
      <h1>CMSH Navigator</h1>
      <span class="sub">Queensland coal mining legislation, recognised standards and guidance</span>
      <span class="status" id="status"><span class="dot" id="dbdot"></span><span id="dbtxt">Loading…</span><button class="btn sm" id="authbtn" hidden></button></span>
    </div>
    <form class="qrow" id="qform" autocomplete="off">
      <label class="qbox" for="q">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" placeholder="Ask a question, e.g. who must review the respirable dust monitoring program?" aria-label="Search question">
      </label>
      <select class="sel" id="docsel" aria-label="Limit to one document"><option value="">All documents</option></select>
      <button class="btn primary" type="submit">Search</button>
      <button class="btn" type="button" id="savebtn" title="Save this search with keywords and a description">Save search</button>
    </form>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="search" aria-selected="true">Search</button>
      <button class="tab" role="tab" data-tab="map" aria-selected="false">Cross-reference map</button>
      <button class="tab" role="tab" data-tab="library" aria-selected="false">Library &amp; versions<span class="n" id="libn"></span></button>
      <button class="tab" role="tab" data-tab="saved" aria-selected="false">Saved searches<span class="n" id="savedn"></span></button>
    </nav>
  </header>

  <div class="filters wrap" id="filters">
    <span class="faint" style="font-size:12px">Show</span>
    <button class="chipf" data-f="all" aria-pressed="true">Everything</button>
    <button class="chipf" data-f="leg" aria-pressed="false">Act &amp; Regulation</button>
    <button class="chipf" data-f="rs" aria-pressed="false">Recognised standards</button>
    <button class="chipf" data-f="gn" aria-pressed="false">Guidance notes &amp; guidelines</button>
    <span class="sp"></span>
    <span class="faint" id="corpus" style="font-size:12px"></span>
  </div>

  <main>
    <section class="view" id="v-search">
      <div class="split" id="split">
        <div class="pane left wrap" id="results"></div>
        <div class="pane right wrap" id="reader"></div>
      </div>
    </section>
    <section class="view scroll" id="v-map" hidden><div class="page wrap" id="map"></div></section>
    <section class="view scroll" id="v-library" hidden><div class="page wrap" id="library"></div></section>
    <section class="view scroll" id="v-saved" hidden><div class="page wrap" id="saved"></div></section>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="parser.js"></script>
<script>
(() => {
'use strict';
/* ================= state ================= */

function inlineForm(code, kind) {

/* ----- uploads ----- */
let pdfjsReady = null;
function loadPdfJs() {
  if (pdfjsReady) return pdfjsReady;
  const add = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load the PDF reader')); document.head.appendChild(s); });
  pdfjsReady = add('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js')
    .then(() => add('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'))
    .then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; return window.pdfjsLib; });
  return pdfjsReady;
}
async function readPdf(file, forCode) {
  const lib = await loadPdfJs();
  const buf = new Uint8Array(await file.arrayBuffer());
  const pdf = await lib.getDocument({ data: buf, disableFontFace: true, isEvalSupported: false }).promise;
  const pages = await CMParser.linesFromPdf(pdf);
  const doc = CMParser.buildDoc(pages, file.name);
  if (forCode && doc.code !== forCode) doc.mismatch = doc.code || '(unknown)';
  return doc;
}
async function handleFiles(files, forCode) {
  for (const f of files) {
    if (!/pdf$/i.test(f.type) && !/\.pdf$/i.test(f.name)) { toast(f.name + ' is not a PDF'); continue; }
    $('#review').innerHTML = `<div class="note" style="margin-top:10px">Reading ${esc(f.name)}…</div>`;
    try {
      const doc = await readPdf(f, forCode);
      S.pending = { file: f, doc, forCode };
      if (forCode) { S.pending.code = forCode; }
      renderReview();
      document.getElementById('review')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return; // review one at a time
    } catch (e) { $('#review').innerHTML = `<div class="note warn" style="margin-top:10px">Couldn't read ${esc(f.name)}: ${esc(e.message || e)}. Scanned PDFs without a text layer can't be indexed.</div>`; }
  }
}
function renderReview() {
  const el = $('#review'); if (!el) return;

  const d = p.doc; const code = p.code || d.code;

    <h3>Check the details for ${esc(p.file.name)}</h3>

    <div class="form">
      <label>Code<input id="rv-code" value="${esc(code)}" placeholder="e.g. RS17, QGN33, CMSHA"></label>
      <label>Type<select id="rv-type">${['act', 'reg', 'rs', 'qgn', 'guideline', 'other'].map(t => `<option value="${t}"${t === d.type ? ' selected' : ''}>${typeName(t)}</option>`).join('')}</select></label>
      <label class="full">Title<input id="rv-title" value="${esc(d.title)}"></label>
      <label>Version<input id="rv-version" value="${esc(d.version || '')}"></label>
      <label>Dated<input id="rv-date" type="date" value="${esc(d.issued || '')}"></label>
      <label>Official URL (optional)<input id="rv-url" value="${esc(existing?.official || (S.base.catalogue.find(c => c.code === code)?.official) || (isLegal ? LEG_URL[d.type] : ''))}"></label>
    </div>
    <p class="muted" style="margin:10px 0">Found ${d.pageCount} pages, ${d.sections.filter(s => !s.boiler).length} sections and ${refs.size} cross-references${d.cites2001 ? '. It cites the repealed 2001 Regulation' : ''}. ${existing ? `<b>This will replace ${esc(code)}</b> (currently ${esc(existing.version ? 'v' + existing.version + ', ' : '')}dated ${esc(fmtDate(existing.issued, existing.issuedExact))}). The current copy is kept so you can revert.` : 'This adds a new document.'}</p>
    ${d.sections.filter(s => !s.boiler).length < 3 ? '<div class="note warn" style="margin-bottom:10px">Very few sections were detected. The document will still be searchable, but clause-level results will be coarse.</div>' : ''}
    <details style="margin-bottom:10px"><summary class="muted" style="cursor:pointer">Preview detected sections</summary><ul class="outline" style="margin-top:8px">${d.sections.filter(s => !s.boiler).slice(0, 80).map(s => `<li><span class="num mono faint">${esc(s.num || '·')}</span>${esc(s.heading)}</li>`).join('')}</ul></details>
    <div class="row"><button class="btn primary" id="rv-save">${existing ? 'Replace ' + esc(code) : 'Add to library'}</button><button class="btn ghost" id="rv-cancel">Cancel</button><span class="faint" id="rv-msg"></span></div>
  </div>`;

async function saveReview() {
  const p = S.pending; if (!p) return;
  const code = ($('#rv-code').value || '').trim().toUpperCase().replace(/\s+/g, '');
  if (!/^[A-Z0-9][A-Z0-9-]{1,30}$/.test(code)) { $('#rv-msg').textContent = 'Give the document a short code, e.g. RS17.'; return; }
  const type = $('#rv-type').value;
  const doc = p.doc;
  // re-key sections if code or type changed
  if (code !== doc.code || type !== doc.type) {
    const legal = type === 'act' || type === 'reg';
    const prefix = legal ? type : code;
    const info = { type, code, num: parseInt(code.replace(/\D/g, '')) || null };
    doc.sections.forEach((s, i) => { s.sid = prefix + ':' + (s.num || 'p' + s.page + '-' + i); s.refs = s.boiler ? [] : CMParser.extractRefs(s.heading + '\n' + s.text, info); });
    doc.code = code; doc.id = code; doc.type = type; doc.num = info.num;
  }
  doc.title = $('#rv-title').value.trim() || doc.title;
  doc.version = $('#rv-version').value.trim() || null;
  const date = $('#rv-date').value; if (date && date !== doc.issued) { doc.issued = date; doc.issuedExact = true; doc.dateBasis = 'entered by you'; }
  doc.official = $('#rv-url').value.trim();
  $('#rv-save').disabled = true; $('#rv-msg').textContent = 'Saving…';
  try {
    const prev = S.records.get(code) || {};
    const existing = S.docs.get(code);
    const history = (prev.history || []).slice(-4);
    if (existing) history.push({ label: (existing.version ? 'v' + existing.version + ' ' : '') + fmtDate(existing.issued, existing.issuedExact), jsonUrl: prev.jsonUrl || null, pdfWebUrl: prev.pdfWebUrl || null, title: prev.title || null, issued: prev.issued || null, version: prev.version || null, type: prev.type || null, at: new Date().toISOString() });
    if (!account) throw new Error('sign in with Microsoft first, so the document can be stored in your OneDrive');
    const json = JSON.stringify(doc);
    const stamp = new Date().toISOString().slice(0, 10) + '-' + Date.now().toString(36);
    $('#rv-msg').textContent = 'Saving to OneDrive…';
    const jm = await uploadFile(new Blob([json], { type: 'application/json' }), 'documents/' + code + '-' + stamp + '.json');
    const jsonUrl = 'od:' + jm.id;
    let pdfWebUrl = '';
    try { const pm = await uploadFile(p.file, 'documents/' + code + '-' + stamp + '.pdf'); pdfWebUrl = pm.webUrl || ''; } catch (e) { /* the PDF copy is optional */ }
    S.uploads.set(jsonUrl, doc);
    const rec = Object.assign({}, prev, { code, type, title: doc.title, issued: doc.issued, version: doc.version, official: doc.official, jsonUrl, pdfWebUrl, uploadedAt: new Date().toISOString(), history, removed: false });
    if (rec.newerDate && doc.issued && doc.issued >= rec.newerDate) delete rec.newerDate;
    await putRecord(code, rec);
    S.pending = null;
    rebuild(); renderLibrary();
    toast((existing ? 'Replaced ' : 'Added ') + code);
    if (S.query) runSearch(S.query, { keepReader: true });
  } catch (e) {
    $('#rv-save').disabled = false;
    $('#rv-msg').textContent = 'Save failed: ' + (e.message || e);
  }
}
async function revert(code) {
  const rec = S.records.get(code); if (!rec) return;
  const hist = (rec.history || []).slice();
  const prev = hist.pop();
  let next;
  if (prev) next = Object.assign({}, rec, { jsonUrl: prev.jsonUrl, pdfWebUrl: prev.pdfWebUrl, title: prev.title, issued: prev.issued, version: prev.version, type: prev.type, history: hist, uploadedAt: prev.at });
  else next = Object.assign({}, rec, { jsonUrl: null, pdfWebUrl: null, history: [], removed: !S.base.docs.some(d => d.code === code) });
  if (!next.jsonUrl) { delete next.jsonUrl; delete next.title; delete next.issued; delete next.version; delete next.type; }
  await putRecord(code, next);
  if (next.jsonUrl) await ensureUpload(next.jsonUrl);
  rebuild(); renderLibrary(); toast('Reverted ' + code);
}

/* ================= OneDrive storage (Microsoft Graph) =================
   Same Azure app registration as Action Tracker. The client ID is not a secret.
   Data lives in OneDrive:  /CMSH Navigator/cmsh-navigator-data.json   (verifications, saved searches)
                            /CMSH Navigator/documents/                 (documents you add: index JSON + PDF)
   ===================================================================== */
const CONFIG = {
  clientId: '3eeffa6d-8645-4792-b9ea-fddf1ead0ca6',
  folder: 'CMSH Navigator',
};
const SCOPES = ['User.Read', 'Files.ReadWrite'];
const GRAPH = 'https://graph.microsoft.com/v1.0';
const DATA_FILE = 'cmsh-navigator-data.json';
const SIMPLE_UPLOAD_MAX = 4 * 1024 * 1024, CHUNK = 327680 * 10;
const LSK = { data: 'cmsh_data_cache', ops: 'cmsh_pending_ops' };
let msalApp = null, account = null, eTag = null, pendingOps = [];
let saving = false, saveAgain = false, saveTimer = null, retryTimer = null, syncState = 'loading';
function lsGet(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

/* ----- data model: { records: {CODE: {...}}, searches: [...] } changed only through ops ----- */
function applyOps(base, ops) {
  const d = { records: Object.assign({}, base.records || {}), searches: (base.searches || []).slice() };
  for (const op of ops) {
    if (op.type === 'record') d.records[op.code] = op.rec;
    else if (op.type === 'search') { const i = d.searches.findIndex(x => x.id === op.rec.id); if (i >= 0) d.searches[i] = op.rec; else d.searches.unshift(op.rec); }
    else if (op.type === 'delsearch') d.searches = d.searches.filter(x => x.id !== op.id);
  }
  return d;
}
let DATA = { records: {}, searches: [] };
function adopt(data) {
  DATA = data;
  S.records = new Map(Object.entries(data.records || {}));
  S.searches = (data.searches || []).slice().sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
}
function commit(op) {
  adopt(applyOps(DATA, [op]));
  pendingOps.push(op);
  lsSet(LSK.data, DATA); lsSet(LSK.ops, pendingOps);
  if (account) scheduleSave(); else setStoreStatus();
}
async function putRecord(code, rec) { commit({ type: 'record', code, rec: JSON.parse(JSON.stringify(rec)) }); }
async function putSearch(rec) { commit({ type: 'search', rec: JSON.parse(JSON.stringify(rec)) }); }
async function delSearch(id) { commit({ type: 'delsearch', id }); }

/* ----- auth ----- */
function redirectUri() { return location.origin + location.pathname.replace(/index\.html$/, ''); }
async function initAuth() {
  if (!window.msal) throw new Error('The Microsoft sign-in library did not load. Check your internet connection and reload.');
  msalApp = new msal.PublicClientApplication({
    auth: { clientId: CONFIG.clientId, authority: 'https://login.microsoftonline.com/consumers', redirectUri: redirectUri(), postLogoutRedirectUri: redirectUri() },
    cache: { cacheLocation: 'localStorage' },
  });
  await msalApp.initialize();
  const resp = await msalApp.handleRedirectPromise();
  if (resp && resp.account) msalApp.setActiveAccount(resp.account);
  account = msalApp.getActiveAccount() || msalApp.getAllAccounts()[0] || null;
  if (account) msalApp.setActiveAccount(account);
}
function signIn() { msalApp.loginRedirect({ scopes: SCOPES, prompt: 'select_account' }); }
async function signOut() { await msalApp.logoutRedirect({ account }); }
async function getToken() {
  if (!account) throw new Error('Not signed in');
  try { return (await msalApp.acquireTokenSilent({ scopes: SCOPES, account })).accessToken; }
  catch (e) {
    const code = (e && (e.errorCode || e.name)) || '';
    if (e instanceof msal.InteractionRequiredAuthError || /interaction_required|login_required|consent_required|no_tokens_found|monitor_window_timeout/.test(code)) {
      setStoreStatus('Session expired — signing in again…');
      await msalApp.acquireTokenRedirect({ scopes: SCOPES, account });
      return new Promise(() => { });
    }
    throw e;
  }
}

/* ----- Graph helpers ----- */
async function graph(path, opts = {}) {
  const token = await getToken();
  const headers = Object.assign({}, opts.headers || {}, { Authorization: 'Bearer ' + token });
  return fetch(path.startsWith('http') ? path : GRAPH + path, Object.assign({}, opts, { headers }));
}
async function graphError(r) {
  let msg = r.status + ' ' + r.statusText;
  try { const j = await r.json(); if (j.error && j.error.message) msg = j.error.message; } catch (e) { }
  const err = new Error(msg); err.status = r.status; return err;
}
async function graphJson(path, opts) { const r = await graph(path, opts); if (!r.ok) throw await graphError(r); return r.status === 204 ? null : r.json(); }
function pathRef(rel) { return '/me/drive/root:/' + [CONFIG.folder].concat(rel.split('/')).map(encodeURIComponent).join('/'); }
async function downloadItem(meta) {
  try { const r = await fetch(meta['@microsoft.graph.downloadUrl'], { cache: 'no-store' }); if (!r.ok) throw new Error('download ' + r.status); return await r.text(); }
  catch (e) { const r = await graph('/me/drive/items/' + meta.id + '/content', { cache: 'no-store' }); if (!r.ok) throw await graphError(r); return r.text(); }
}
async function uploadFile(blob, rel) {
  if (blob.size <= SIMPLE_UPLOAD_MAX) return graphJson(pathRef(rel) + ':/content', { method: 'PUT', body: blob });
  const sess = await graphJson(pathRef(rel) + ':/createUploadSession', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': 'replace' } }) });
  let start = 0, last = null;
  while (start < blob.size) {
    const end = Math.min(start + CHUNK, blob.size);
    const r = await fetch(sess.uploadUrl, { method: 'PUT', headers: { 'Content-Range': `bytes ${start}-${end - 1}/${blob.size}` }, body: blob.slice(start, end) });
    if (!(r.ok || r.status === 202)) throw new Error('Upload failed (' + r.status + ')');
    if (r.status === 200 || r.status === 201) last = await r.json();
    start = end;
  }
  return last;
}

/* ----- sync the data file ----- */
async function fetchRemote() {
  let meta;
  try { meta = await graphJson(pathRef(DATA_FILE)); }
  catch (e) { if (e.status === 404) { eTag = null; return { records: {}, searches: [] }; } throw e; }
  eTag = meta.eTag;
  const text = await downloadItem(meta);
  if (!text.trim()) return { records: {}, searches: [] };
  const j = JSON.parse(text);
  return { records: j.records || {}, searches: j.searches || [] };
}
function scheduleSave() { clearTimeout(saveTimer); setStoreStatus('Saving…'); saveTimer = setTimeout(saveNow, 400); }
async function saveNow() {
  if (!account) return;
  if (saving) { saveAgain = true; return; }
  if (!pendingOps.length) { syncState = 'synced'; setStoreStatus(); return; }
  saving = true; clearTimeout(retryTimer);
  try {
    let done = false;
    for (let attempt = 0; attempt < 4 && !done; attempt++) {
      const sent = pendingOps.length;
      const body = JSON.stringify({ schema: 'cmsh-navigator/1', savedAt: new Date().toISOString(), records: DATA.records, searches: DATA.searches }, null, 1);
      const headers = { 'Content-Type': 'application/json' };
      if (eTag) headers['If-Match'] = eTag; else headers['If-None-Match'] = '*';
      const r = await graph(pathRef(DATA_FILE) + ':/content', { method: 'PUT', headers, body });
      if (r.status === 412) { const remote = await fetchRemote(); adopt(applyOps(remote, pendingOps)); continue; }
      if (!r.ok) throw await graphError(r);
      eTag = (await r.json()).eTag;
      pendingOps = pendingOps.slice(sent);
      lsSet(LSK.data, DATA); lsSet(LSK.ops, pendingOps);
      done = true;
    }
    if (!done) throw new Error('kept clashing with another device');
    if (pendingOps.length) saveAgain = true; else { syncState = 'synced'; setStoreStatus(); }
  } catch (e) {
    console.error(e);
    syncState = 'error';
    setStoreStatus((navigator.onLine === false ? 'Offline' : 'Not saved') + ' — ' + pendingOps.length + ' change(s) waiting, will retry');
    retryTimer = setTimeout(saveNow, 30000);
  } finally {
    saving = false;
    if (saveAgain) { saveAgain = false; saveNow(); }
    await Promise.all([...S.records.values()].map(r => ensureUpload(r.jsonUrl)));
    rebuild(); refreshViews();
  }
}
async function refreshFromRemote() {
  if (!account || saving || pendingOps.length) return;
  try {
    const remote = await fetchRemote();
    if (saving || pendingOps.length) return;
    adopt(remote); lsSet(LSK.data, DATA);
    await Promise.all([...S.records.values()].map(r => ensureUpload(r.jsonUrl)));
    rebuild(); refreshViews(); syncState = 'synced'; setStoreStatus();
  } catch (e) { syncState = 'error'; setStoreStatus('Could not reach OneDrive — showing last saved copy'); }
}

/* ----- documents you added (index JSON stored in OneDrive) ----- */
async function ensureUpload(url) {
  if (!url || S.uploads.has(url) || !url.startsWith('od:') || !account) return;
  try {
    const meta = await graphJson('/me/drive/items/' + url.slice(3));
    S.uploads.set(url, JSON.parse(await downloadItem(meta)));
  } catch (e) { console.warn('Could not load an added document', e); }
}

/* ----- status line ----- */
function setStoreStatus(msg) {
  const b = $('#authbtn');
  let cls = '', txt;
  if (!msalApp) { txt = msg || 'Microsoft sign-in unavailable — saving in this browser only'; b.hidden = true; }
  else if (!account) {
    txt = msg || (pendingOps.length ? `${pendingOps.length} change(s) saved in this browser — sign in to sync` : 'Not signed in — searching works; sign in to save to OneDrive');
    b.hidden = false; b.textContent = 'Sign in with Microsoft'; b.onclick = signIn;
  } else {
    if (msg) txt = msg;
    else if (syncState === 'synced') { cls = 'on'; txt = 'Synced with OneDrive · ' + new Date().toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' }); }
    else if (syncState === 'error') txt = 'Could not reach OneDrive';
    else txt = 'Connecting to OneDrive…';
    b.hidden = false; b.textContent = 'Sign out'; b.title = account.username || ''; b.onclick = () => { if (!pendingOps.length || window.confirm('Some changes have not reached OneDrive yet. Sign out anyway?')) signOut(); };
  }
  $('#dbdot').className = 'dot ' + cls; $('#dbtxt').textContent = txt;
}

async function connectStore() {
  adopt(applyOps(lsGet(LSK.data, { records: {}, searches: [] }), []));
  pendingOps = lsGet(LSK.ops, []);
  rebuild(); refreshViews();
  try { await initAuth(); }
  catch (e) { console.error(e); msalApp = null; setStoreStatus(); return; }
  setStoreStatus();
  if (!account) return;
  try {
    const remote = await fetchRemote();
    adopt(applyOps(remote, pendingOps)); lsSet(LSK.data, DATA);
    await Promise.all([...S.records.values()].map(r => ensureUpload(r.jsonUrl)));
    rebuild(); refreshViews();
    if (pendingOps.length) saveNow(); else { syncState = 'synced'; setStoreStatus(); }
  } catch (e) {
    console.error(e); syncState = 'error';
    setStoreStatus(e.status === 401 || e.status === 403 ? 'OneDrive refused access — sign out and in again' : 'Could not reach OneDrive — showing last saved copy');
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshFromRemote(); });
}
function refreshViews() {
  $('#savedn').textContent = S.searches.length || '';
  if (!$('#v-library').hidden) renderLibrary();
  if (!$('#v-map').hidden) renderMap();
  if (!$('#v-saved').hidden) renderSaved();
  if (!$('#v-search').hidden && S.query) renderResults();
}

/* ================= saved searches ================= */
let savedFilter = { text: '', kw: '' };
function openSaveForm(existing) {
  const q = existing ? existing.query : S.query;
  if (!q) { toast('Run a search first, then save it'); $('#q').focus(); return; }
  showTab('saved');
  const el = $('#saveform');
  el.innerHTML = `<div class="box" style="margin-bottom:16px"><h3>${existing ? 'Edit saved search' : 'Save this search'}</h3>
    <div class="form">
      <label class="full">Question<input id="sv-q" value="${esc(q)}"></label>
      <label class="full">Description<textarea id="sv-d" rows="2" placeholder="What were you looking for and why? e.g. Audit prep: dust monitoring program review obligations">${esc(existing?.description || '')}</textarea></label>
      <label class="full">Keywords<input id="sv-k" placeholder="Comma separated, e.g. dust, audit, SSE" value="${esc((existing?.keywords || []).join(', '))}"></label>
    </div>
    <p class="faint" style="font-size:12px;margin:8px 0">${existing ? '' : `Saves the question, the current filters and the top ${Math.min(10, S.results.length)} results.`}</p>
    <div class="row"><button class="btn primary" id="sv-save" data-id="${esc(existing?.id || '')}">Save</button><button class="btn ghost" id="sv-cancel">Cancel</button></div></div>`;
  $('#sv-d').focus();
}
async function saveSearchForm() {
  const id = $('#sv-save').dataset.id;
  const existing = S.searches.find(s => s.id === id);
  const q = $('#sv-q').value.trim(); if (!q) return;
  const kws = [...new Set($('#sv-k').value.split(',').map(k => k.trim()).filter(Boolean))];
  const rec = existing ? Object.assign({}, existing) : { id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), createdAt: new Date().toISOString(), filter: S.filter, docFilter: S.docFilter };
  rec.query = q; rec.description = $('#sv-d').value.trim(); rec.keywords = kws; rec.updatedAt = new Date().toISOString();
  if (!existing || existing.query !== q) {
    const r = search(q);
    rec.results = r.results.slice(0, 10).map(x => ({ sid: x.s.sid, label: secLabel(x.s), heading: x.s.heading }));
  }
  $('#sv-save').disabled = true;
  try { await putSearch(rec); $('#saveform').innerHTML = ''; toast('Search saved'); renderSaved(); }
  catch (e) { $('#sv-save').disabled = false; toast('Could not save: ' + (e.message || e.code)); }
}
function renderSaved() {
  const all = S.searches;
  const kwCounts = new Map(); all.forEach(s => (s.keywords || []).forEach(k => kwCounts.set(k.toLowerCase(), (kwCounts.get(k.toLowerCase()) || 0) + 1)));
  const t = savedFilter.text.toLowerCase();
  const list = all.filter(s => (!savedFilter.kw || (s.keywords || []).some(k => k.toLowerCase() === savedFilter.kw)) && (!t || [s.query, s.description, ...(s.keywords || [])].join(' ').toLowerCase().includes(t)));
  const form = $('#saveform')?.innerHTML || '';
  $('#saved').innerHTML = `<h2>Saved searches</h2>
    <p class="lead">Questions you've saved, with your description and keywords. Run one again to see current results; the snapshot shows what it returned when saved.</p>
    <div id="saveform">${form}</div>
    ${all.length ? `<div class="toolbar"><input class="sel" id="sv-filter" placeholder="Filter by keyword, description or question" value="${esc(savedFilter.text)}" style="flex:1 1 260px;height:36px">
      </div><div class="kw" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${[...kwCounts.entries()].sort((a, b) => b[1] - a[1]).map(([k, n]) => `<button class="kwchip" data-kw="${esc(k)}" aria-pressed="${savedFilter.kw === k}">${esc(k)} <span style="opacity:.6">${n}</span></button>`).join('')}</div>` : ''}
    <div class="saved">${list.map(s => `<div class="scard">
      <div class="q">${esc(s.query)}</div>
      ${s.description ? `<div class="d">${esc(s.description)}</div>` : ''}
      <div class="kw">${(s.keywords || []).map(k => `<button class="kwchip" data-kw="${esc(k.toLowerCase())}" aria-pressed="${savedFilter.kw === k.toLowerCase()}">${esc(k)}</button>`).join('')}</div>
      ${s.results?.length ? `<div class="snap">Top results when saved: ${s.results.slice(0, 4).map(r => `<button class="mini" data-sid="${esc(r.sid)}" title="${esc(r.heading)}">${esc(r.label)}</button>`).join(' ')}</div>` : ''}
      <div class="row" style="margin-top:8px"><button class="btn sm primary" data-run="${esc(s.id)}">Run search</button><button class="btn sm" data-edit="${esc(s.id)}">Edit</button><button class="btn sm ghost danger" data-del="${esc(s.id)}">Delete</button><span class="faint" style="font-size:12px;margin-left:auto">Saved ${fmtDate((s.createdAt || '').slice(0, 10))}${s.filter && s.filter !== 'all' ? ' · filter: ' + esc(s.filter) : ''}${s.docFilter ? ' · ' + esc(s.docFilter) : ''}</span></div>
      <div data-delconfirm="${esc(s.id)}"></div>
    </div>`).join('') || (all.length ? '<p class="muted">No saved searches match.</p>' : `<div class="empty"><h3>No saved searches yet</h3><p>Run a search, then choose <b>Save search</b> to keep it with a description and keywords.</p></div>`)}</div>`;
  $('#savedn').textContent = all.length || '';
}

/* ================= tabs & events ================= */
function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === name));
  ['search', 'map', 'library', 'saved'].forEach(v => $('#v-' + v).hidden = v !== name);
  $('#filters').hidden = name !== 'search';
  if (name === 'map') renderMap();
  if (name === 'library') renderLibrary();
  if (name === 'saved') renderSaved();
  try { localStorage.setItem('cmsh.tab', name); } catch (e) { }
}
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-try]'); if (!t) return;
  const ds = t.dataset;
  if (ds.tab) return showTab(ds.tab);
  if (ds.tabGo) return showTab(ds.tabGo);
  if (ds.try) return runSearch(ds.try);
  if (ds.f) { S.filter = ds.f; document.querySelectorAll('.chipf').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === ds.f)); if (S.query) runSearch(S.query, { keepReader: true }); return; }
  if (ds.clearfilter !== undefined) { S.filter = 'all'; S.docFilter = ''; $('#docsel').value = ''; document.querySelectorAll('.chipf').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === 'all')); return runSearch(S.query, { keepReader: true }); }
  if (ds.sid) { showTab('search'); return openSection(ds.sid); }
  if (ds.key) return openKey(ds.key);
  if (ds.doc) return openDoc(ds.doc);
  if (ds.cite) { const [k, c] = ds.cite.split('|'); const s = (S.cited.get(k) || []).find(x => x.doc.code === c); if (s) { showTab('search'); openSection(s.sid); } return; }
  if (ds.back !== undefined) { $('#split').classList.remove('reading'); return; }
  if (ds.copy) { const txt = ds.copy; (navigator.clipboard?.writeText(txt) || Promise.reject()).then(() => toast('Citation copied'), () => toast(txt)); return; }
  if (ds.verify) return inlineForm(ds.verify, 'verify');
  if (ds.newer) return inlineForm(ds.newer, 'newer');
  if (ds.revert) return inlineForm(ds.revert, 'revert');
  if (ds.cancel) { const h = document.querySelector(`[data-inline="${CSS.escape(ds.cancel)}"]`); if (h) h.innerHTML = ''; return; }
  if (ds.saveverify) { const c = ds.saveverify; const rec = Object.assign({ code: c }, S.records.get(c) || {}, { verifiedAt: $('#vdate-' + CSS.escape(c)).value || today(), verifyNote: $('#vnote-' + CSS.escape(c)).value.trim() }); putRecord(c, rec).then(() => { renderLibrary(); toast(c + ' marked verified'); }, err => toast('Could not save: ' + (err.message || err.code))); return; }
  if (ds.savenewer) { const c = ds.savenewer; const rec = Object.assign({ code: c }, S.records.get(c) || {}, { newerDate: $('#ndate-' + CSS.escape(c)).value }); putRecord(c, rec).then(() => { renderLibrary(); toast('Recorded. Use Replace to add the newer file.'); }); return; }
  if (ds.clearnewer) { const c = ds.clearnewer; const rec = Object.assign({}, S.records.get(c) || {}); delete rec.newerDate; putRecord(c, rec).then(renderLibrary); return; }
  if (ds.dorevert) return revert(ds.dorevert);
  if (ds.run) { const s = S.searches.find(x => x.id === ds.run); if (!s) return; S.filter = s.filter || 'all'; S.docFilter = S.docs.has(s.docFilter) ? s.docFilter : ''; $('#docsel').value = S.docFilter; document.querySelectorAll('.chipf').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === S.filter)); return runSearch(s.query); }
  if (ds.edit) return openSaveForm(S.searches.find(x => x.id === ds.edit));
  if (ds.del) { const h = document.querySelector(`[data-delconfirm="${CSS.escape(ds.del)}"]`); h.innerHTML = `<div class="inline"><span>Delete this saved search?</span><div class="row"><button class="btn sm danger" data-dodel="${esc(ds.del)}">Delete</button><button class="btn sm ghost" data-nodel="${esc(ds.del)}">Cancel</button></div></div>`; return; }
  if (ds.dodel) { delSearch(ds.dodel).then(() => { renderSaved(); toast('Deleted'); }); return; }
  if (ds.nodel) { document.querySelector(`[data-delconfirm="${CSS.escape(ds.nodel)}"]`).innerHTML = ''; return; }
  if (ds.kw !== undefined) { savedFilter.kw = savedFilter.kw === ds.kw ? '' : ds.kw; return renderSaved(); }
  if (t.id === 'rv-save') return saveReview();
  if (t.id === 'rv-cancel') { S.pending = null; return renderReview(); }
  if (t.id === 'sv-save') return saveSearchForm();
  if (t.id === 'sv-cancel') { $('#saveform').innerHTML = ''; return; }
  if (t.id === 'savebtn') return openSaveForm();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'upfile') { handleFiles([...t.files]); t.value = ''; }
  if (t.dataset.replace) { handleFiles([...t.files], t.dataset.replace); t.value = ''; }
  if (t.id === 'docsel') { S.docFilter = t.value; if (S.query) runSearch(S.query, { keepReader: true }); }
});
document.addEventListener('input', e => { if (e.target.id === 'sv-filter') { savedFilter.text = e.target.value; const pos = e.target.selectionStart; renderSaved(); const f = $('#sv-filter'); f.focus(); f.setSelectionRange(pos, pos); } });
document.addEventListener('dragover', e => { const d = e.target.closest?.('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest?.('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest?.('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); handleFiles([...e.dataTransfer.files]); } });
$('#qform').addEventListener('submit', e => { e.preventDefault(); runSearch($('#q').value); });

/* ================= boot ================= */
(async function boot() {
  try {
    S.base = await (await fetch('docs.json')).json();
  } catch (e) { $('#results').innerHTML = '<div class="empty"><h3>The document index failed to load.</h3><p>Reload the page to try again.</p></div>'; return; }
  rebuild();
  const h = decodeURIComponent(location.hash.slice(1));
  renderResults();
  if (h.startsWith('doc-')) openDoc(h.slice(4));
  else if (h && S.bySid.has(h.replace('_', ':'))) openSection(h.replace('_', ':'), { noHash: true });
  else { let tab = 'search'; try { tab = localStorage.getItem('cmsh.tab') || 'search'; } catch (e) { } showTab(tab); }
  connectStore();
})();
})();
</script>
</body>
</html>
